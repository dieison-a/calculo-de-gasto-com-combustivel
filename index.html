<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viagem de Maria</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="card">
      <h1>Cálculo de Gasto com Combustível</h1>

      <form action="calculaCombustivel.php" method="post">
        <label for="distancia">Distância até o destino (km):</label>
        <input type="number" name="distancia" id="distancia" step="0.1" min="0" required />

        <br /><br />

        <label for="consumo">Consumo do carro (km/litro):</label>
        <input type="number" name="consumo" id="consumo" step="0.1" min="0.1" required />

        <br /><br />

        <label for="precoGasolina">Preço da gasolina (R$/litro):</label>
        <input type="number" name="precoGasolina" id="precoGasolina" step="0.01" min="0" required />

        <br /><br />

        <input type="submit" value="Calcular" />

        <input type="reset" value="Limpar" />
      </form>
    </main>
  </body>
</html>
